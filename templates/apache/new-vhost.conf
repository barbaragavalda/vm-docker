<VirtualHost *:443>
#        SSLEngine On
#        SSLCertificateFile /etc/ssl/localcerts/apache.pem
#        SSLCertificateKeyFile /etc/ssl/localcerts/apache.key
        ServerName {HOST_NAME}
        ServerAlias {HOST_NAME}
        ServerAdmin {HOST_ADMIN_EMAIL}
        DocumentRoot /usr/local/apache2/htdocs/{HOST_NAME_ALIAS}
        <Directory /usr/local/apache2/htdocs/{HOST_NAME_ALIAS}>
                Options Indexes FollowSymLinks MultiViews
                LogLevel alert rewrite:trace6
                AllowOverride All
                Order allow,deny
                allow from all
        </Directory>
        ProxyPassMatch "^/(.\.php(/.)?)$" "fcgi://php:9000/var/www/html/{HOST_NAME_ALIAS}/$1"
</VirtualHost>
<VirtualHost *:80>
        ServerName {HOST_NAME}
        ServerAlias {HOST_NAME}
        ServerAdmin {HOST_ADMIN_EMAIL}
        DocumentRoot /usr/local/apache2/htdocs/{HOST_NAME_ALIAS}
        <Directory /usr/local/apache2/htdocs/{HOST_NAME_ALIAS}>
                Options Indexes FollowSymLinks MultiViews
                LogLevel alert rewrite:trace6
                AllowOverride All
                Order allow,deny
                allow from all
        </Directory>
        ProxyPassMatch "^/(.*\.php)$" "fcgi://php:9000/var/www/html/{HOST_NAME_ALIAS}/$1"
</VirtualHost>