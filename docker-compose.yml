#
# Builds and runs all docker containers to start a new VM
# @file docker-compose.yml

version: '3.3'
services:
 hellow-world:
  build: './system/docker/hello-world'
  container_name: hello-world
 php:
  build: './system/docker/php'
  container_name: php
  networks:
   - backend
  restart: always
 mariadb:
  build: './system/docker/mariadb'
  container_name: mariadb
  networks:
   - backend
  environment:
   MYSQL_ROOT_PASSWORD:
   MYSQL_USER:
   MYSQL_PASSWORD:
   MYSQL_ALLOW_EMPTY_PASSWORD: 0
   MYSQL_RANDOM_ROOT_PASSWORD: 0
  restart: always
  ports:
   - "3306:3306"
 apache:
  build: './system/docker/apache'
  container_name: apache
  depends_on:
   - php
  networks:
   - backend
   - frontend
  ports:
   - "80:80/tcp"
   - "443:443/tcp"
  restart: always
networks:
  backend:
  frontend: